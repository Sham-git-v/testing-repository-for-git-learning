<template>
    <lightning-card title="Record View Form">
        <div class="slds-var-p-around_small">
            <lightning-record-view-form record-id={recordId} object-api-name={objectApiName}>
                <div class="slds-grid slds-gutters">
                    <div class="slds-col">
                        <lightning-output-field field-name={conFirstName}></lightning-output-field>
                        <lightning-output-field field-name={conLastName}></lightning-output-field>
                        <lightning-output-field field-name={conEmail}></lightning-output-field>
                    </div>
                </div> 
            </lightning-record-view-form>
        </div>
    </lightning-card>
</template>
