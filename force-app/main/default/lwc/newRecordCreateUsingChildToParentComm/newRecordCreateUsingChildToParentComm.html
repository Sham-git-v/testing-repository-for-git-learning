<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Create Case Record</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
               <div class="slds-var-p-around_small">
                    <lightning-input name = "sbj" label = "Case subject"   type="text"  onchange={changeHandler} required="true"> </lightning-input>
                    <template lwc:if={caseStatusList.data}>
                        <lightning-combobox name="sts" label="Select Status" placeholder="status"
                            options={caseStatusList.data.values} onchange={changeHandler}></lightning-combobox>
                    </template>                    
                    <template lwc:if={caseOriginList.data}>
                        <lightning-combobox label="Select origin" name="org" placeholder="origin" options={caseOriginList.data.values} onchange={changeHandler}></lightning-combobox>
                    </template>
               </div>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label = "Create Case" variant="brand" onclick={createHandler}></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
