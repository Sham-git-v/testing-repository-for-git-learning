<template>

    <template if:true={showModal}>
        <c-new-record-create-using-child-to-parent-comm onrecordcreated={handleClick}></c-new-record-create-using-child-to-parent-comm>
    </template>

    <lightning-card title="Update Multiple Records">
        <div class="slds-p-around_medium">
            
            <lightning-button label="Create Case" onclick={createRecord}></lightning-button>
            <lightning-button label="Update Status as Closed" onclick={updateRecords}></lightning-button>
        </div>
        <div class="slds-p-around_medium">
        <template lwc:if={cases.data}>            
        <lightning-datatable
            key-field='Id'
            data={cases.data}
            columns={columns}
        ></lightning-datatable>
        </template>
        </div>
        <p>{handle}</p>
    </lightning-card>
</template>
