<template>
    <lightning-quick-action-panel header="Quick Account Creation">
        <div class="slds-var-p-around_small">
            <lightning-record-edit-form object-api-name="Contact" onsuccess={successHandler} onerror={errorHandler}>
                <lightning-input-field field-name={contactLastName}></lightning-input-field>
                <lightning-input-field field-name={contactPhone}></lightning-input-field>
                <lightning-input-field field-name={contactEmail}></lightning-input-field>
                <lightning-button
                variant="neutral"
                label="Cancel"
                onclick={cancelHandler}
            ></lightning-button>
            <lightning-button
                variant="brand"
                label="Save"
                type="submit"
                class="slds-m-left_x-small"
            ></lightning-button>
            </lightning-record-edit-form>
        </div>
    </lightning-quick-action-panel>
</template>
