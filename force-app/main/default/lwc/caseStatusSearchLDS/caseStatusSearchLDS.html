<template>
    <lightning-card title="Case Status Search" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <lightning-input 
                label="Enter Case Status" 
                value={caseName}
                type="text" 
                onchange={changeHandler}>
            </lightning-input>

            
            <lightning-datatable 
                key-field="Id" 
                data={cases} 
                columns={columns} 
                hide-checkbox-column="true">
            </lightning-datatable>
        </div>
    </lightning-card>
</template>
